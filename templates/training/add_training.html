{% extends "base/base.html" %}

{% block title %}Add Training & Drill for {{ driver.D_Name }}{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <span class="form-card-icon"><i class="fa fa-plus"></i></span>
    <h1 class="form-card-title">Add Drill &amp; Training</h1>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="form-card-body">
      <div>
        <label class="field-label" for="driver-id">Driver ID <span class="text-accent-600">*</span></label>
        <input type="text" readonly value="{{ driver.D_Number }}" id="driver-id" class="field-input bg-ink-50 text-ink-500">
      </div>
      <div>
        <label class="field-label" for="full-name">Full Name <span class="text-accent-600">*</span></label>
        <input type="text" readonly value="{{ driver.D_Name }}" id="full-name" class="field-input bg-ink-50 text-ink-500">
      </div>
      <div>
        <label class="field-label" for="select-training">Select Training</label>
        <select id="select-training" name="train" required class="field-input js-searchable-select" data-placeholder="Search training...">
          <option></option>
          {% for t in training %}
          <option value="{{ t.id }}">{{ t.train_name }} ({{ t.training_month }})</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="field-label" for="select-drill">Select Drill</label>
        <select id="select-drill" name="drill" required class="field-input js-searchable-select" data-placeholder="Search drill...">
          <option></option>
          {% for d in drills %}
          <option value="{{ d.id }}">{{ d.drill_name }} ({{ d.drilling_month }})</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="field-label" for="completion-date">Completion Date <span class="text-accent-600">*</span></label>
        <input type="date" id="completion-date" name="date" required class="field-input">
      </div>
    </div>
    <div class="form-card-footer">
      <button type="submit" class="btn-accent">Submit</button>
      <button type="reset" class="btn-ghost">Reset</button>
    </div>
  </form>
</div>
{% endblock %}
