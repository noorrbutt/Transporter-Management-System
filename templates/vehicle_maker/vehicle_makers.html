{% extends "base/base.html" %}

{% block title %}All Vehicle Makers{% endblock %}

{% block content %}
<div class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-lg font-semibold text-ink-900">Vehicle Makers</h1>
    <a href="/addmaker" class="btn-accent">
      <i class="fa fa-plus"></i> Add Vehicle Maker
    </a>
  </div>

  <div class="card">
    <div class="data-table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for vehicle in vehicle_makers %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ vehicle.VMNAME }}</td>
            <td>
              <div class="flex items-center gap-3">
                <a href="{% url 'edit_maker' vehicle.VMid %}" class="row-action"><i class="fa fa-edit"></i> Edit</a>
                <form method="post" action="{% url 'delete_maker' vehicle.VMid %}" onsubmit="return confirm('Are you sure you want to delete this entry?');">
                  {% csrf_token %}
                  <button type="submit" class="row-action is-danger"><i class="fa fa-trash"></i> Delete</button>
                </form>
              </div>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
