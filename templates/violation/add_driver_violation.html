{% extends "base/base.html" %}

{% block title %}Add {{ driver.D_Name }} Violation{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <span class="form-card-icon"><i class="fa fa-plus"></i></span>
    <h1 class="form-card-title">Add Violation under {{ driver.D_Name }}</h1>
  </div>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-card-body">
      <div>
        <label class="field-label" for="driver-id">Driver ID <span class="text-accent-600">*</span></label>
        <input type="text" readonly value="{{ driver.D_Number }}" id="driver-id" name="driverId" required class="field-input bg-ink-50 text-ink-500">
      </div>
      <div>
        <label class="field-label" for="full-name">Full Name <span class="text-accent-600">*</span></label>
        <input type="text" readonly value="{{ driver.D_Name }}" id="full-name" name="fullName" required class="field-input bg-ink-50 text-ink-500">
      </div>
      <div>
        <label class="field-label" for="violation-date">Violation Date <span class="text-accent-600">*</span></label>
        <input type="date" id="violation-date" name="violationDate" required class="field-input">
      </div>
      <div>
        <label class="field-label" for="violation-type">Violation Type</label>
        <select id="violation-type" name="violationType" class="field-input">
          {% for violation in violations %}
          <option>{{ violation.violation_type }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="field-label" for="details">Details</label>
        <textarea id="details" name="details" rows="4" placeholder="Add more details here..." class="field-input resize-y"></textarea>
      </div>
    </div>
    <div class="form-card-footer">
      <button type="submit" class="btn-accent">Submit</button>
      {% if 'edit' not in request.path %}
      <button type="reset" class="btn-ghost">Reset</button>
      {% endif %}
    </div>
  </form>
</div>
{% endblock %}
