{% extends 'base/base.html' %}

{% block title %}Violations{% endblock %}

{% block content %}
<div class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h1 class="page-heading">Violation Types</h1>
    <a href="/addviolation" class="btn-accent">
      <i class="fa fa-plus"></i> Add Violation Type
    </a>
  </div>

  <div class="card">
    <div class="data-table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Violation Type</th>
          </tr>
        </thead>
        <tbody>
          {% for v in violations %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ v.violation_type }}</td>
          </tr>
          {% empty %}
          <tr><td colspan="2" class="text-center text-ink-400 py-6">No violation types defined yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
