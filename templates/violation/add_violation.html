{% extends 'base/base.html' %}

{% block title %}Add Violation Type{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <span class="form-card-icon"><i class="fa fa-plus"></i></span>
    <h1 class="form-card-title">Add Violation Type</h1>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="form-card-body">
      <div>
        <label class="field-label" for="violation_type">Violation Type <span class="text-accent-600">*</span></label>
        <input type="text" id="violation_type" name="violation_type" required class="field-input" placeholder="e.g. Speeding">
      </div>
    </div>
    <div class="form-card-footer">
      <button type="submit" class="btn-accent">Save</button>
      <a href="/violations" class="btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
