{% extends "base/base.html" %}

{% block title %}{{ action }} Company{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <span class="form-card-icon"><i class="fa fa-plus"></i></span>
    <h1 class="form-card-title">{{ action }} Company</h1>
  </div>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-card-body">
      <div>
        <label class="field-label" for="cabb">Abbreviation <span class="text-accent-600">*</span></label>
        <input type="text" name="cabb" value="{{ company.cabb }}" id="cabb" required class="field-input">
      </div>
      <div>
        <label class="field-label" for="company_name">Name <span class="text-accent-600">*</span></label>
        <input type="text" name="company_name" value="{{ company.cname }}" id="company_name" required class="field-input">
      </div>
    </div>
    <div class="form-card-footer">
      <button type="submit" class="btn-accent">Submit</button>
      {% if 'edit' not in request.path %}
      <button type="reset" class="btn-ghost">Reset</button>
      {% endif %}
    </div>
  </form>
</div>
{% endblock %}
